<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="640" viewBox="0 0 1080 640" font-family="Pretendard, 'Malgun Gothic', sans-serif">
  <rect width="1080" height="640" fill="#F4F1FA"/>

  <!-- 좌측 입력 패널 -->
  <rect x="40" y="40" width="470" height="560" rx="16" fill="#FFFFFF"/>
  <text x="72" y="88" font-size="22" font-weight="700" fill="#2E2838">제품</text>

  <text x="72" y="132" font-size="15" font-weight="600" fill="#6B6478">제품명</text>
  <rect x="72" y="146" width="406" height="46" rx="8" fill="#F7F5FB"/>
  <text x="88" y="176" font-size="17" fill="#2E2838">무선 청소기 X200</text>

  <text x="72" y="228" font-size="15" font-weight="600" fill="#6B6478">정상가</text>
