  <text x="580" y="566" font-size="14" fill="#8A6D1F">발행 전에 실제 도구 화면 캡처로 바꿔주세요.</text>
  <text x="580" y="588" font-size="14" fill="#8A6D1F">work-jiuen.vercel.app/tools/banner-maker.html</text>
