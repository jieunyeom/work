<meta charset="utf-8">
<title>캐러셀 에디터</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
  :root{
    --ui-bg:#141414;
    --ui-panel:#1c1c1c;
    --ui-line:#2e2e2e;
    --ui-text:#e8e8e8;
    --ui-dim:#8a8a8a;
    --ui-accent:#e9ed12;
    --ui-radius:6px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--ui-bg);
    color:var(--ui-text);
    font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    font-size:13px;
    overflow:hidden;
  }
  button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
  button{cursor:pointer;border:none;background:none}

  /* ---------- shell ---------- */
  #app{display:grid;grid-template-rows:48px 1fr;height:100vh}
  .topbar{
    display:flex;align-items:center;gap:8px;
    padding:0 14px;border-bottom:1px solid var(--ui-line);background:var(--ui-panel);
  }
  .topbar .brand{font-weight:700;letter-spacing:-.02em;margin-right:6px}
  .topbar .brand span{color:var(--ui-accent)}
  .topbar .spacer{flex:1}
  .btn{
    padding:7px 12px;border:1px solid var(--ui-line);border-radius:var(--ui-radius);
    background:#232323;white-space:nowrap;
  }
  .btn:hover{background:#2c2c2c}
  .btn.primary{background:var(--ui-accent);color:#111;border-color:var(--ui-accent);font-weight:700}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn.ghost{background:transparent}
  .btn:disabled{opacity:.4;cursor:not-allowed}

  .body{display:grid;grid-template-columns:150px 1fr 300px;height:100%;min-height:0}

  /* ---------- slide rail ---------- */
  .rail{border-right:1px solid var(--ui-line);background:var(--ui-panel);overflow-y:auto;padding:10px}
  .rail h3,.insp h3{font-size:11px;color:var(--ui-dim);letter-spacing:.08em;margin-bottom:8px}
  .thumb{
    position:relative;width:100%;aspect-ratio:4/5;border:1px solid var(--ui-line);
    border-radius:var(--ui-radius);margin-bottom:8px;overflow:hidden;cursor:pointer;
  }
  .thumb.active{border-color:var(--ui-accent);box-shadow:0 0 0 1px var(--ui-accent)}
  .thumb .no{
    position:absolute;top:4px;left:5px;z-index:2;font-size:10px;font-weight:700;
    background:rgba(0,0,0,.6);color:#fff;padding:1px 5px;border-radius:3px;
  }
  .thumb .mini{position:absolute;inset:0;transform-origin:top left;pointer-events:none}

  /* ---------- canvas ---------- */
  .canvas-area{
    display:flex;align-items:center;justify-content:center;
    overflow:auto;padding:24px;background:
      repeating-conic-gradient(#191919 0% 25%, #1e1e1e 0% 50%) 50%/18px 18px;
  }
  .stage-wrap{position:relative}
  #stage{
    position:relative;width:1080px;height:1350px;transform-origin:top left;overflow:hidden;
  }
  .el{position:absolute;outline:1px solid transparent}
  .el.selected{outline:1.5px dashed var(--ui-accent);outline-offset:2px}
  .el.text{white-space:pre-wrap;word-break:keep-all;cursor:move}
  .el.media{overflow:hidden;cursor:move;background:#222}
  .el.media img,.el.media video{width:100%;height:100%;display:block}
  .el.media .dim{position:absolute;inset:0;pointer-events:none}
  .el.media .ph{
    display:flex;align-items:center;justify-content:center;height:100%;
    color:#666;font-size:26px;letter-spacing:.02em;background:
      repeating-linear-gradient(45deg,#262626 0 14px,#202020 14px 28px);
  }
  .el.divider{cursor:move}
  .el b{font-weight:800}
  .el mark{padding:0 .12em;border-radius:2px}

  .handle{
    position:absolute;width:14px;height:14px;background:var(--ui-accent);
    border:2px solid #111;border-radius:50%;z-index:50;
  }
  .h-nw{cursor:nwse-resize}.h-ne{cursor:nesw-resize}
  .h-sw{cursor:nesw-resize}.h-se{cursor:nwse-resize}

  /* ---------- inspector ---------- */
  .insp{border-left:1px solid var(--ui-line);background:var(--ui-panel);overflow-y:auto;padding:12px}
  .group{border-bottom:1px solid var(--ui-line);padding:0 0 14px;margin-bottom:14px}
  .group:last-child{border-bottom:none}
  .row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .row label{width:70px;flex:none;color:var(--ui-dim);font-size:12px}
  .row .val{width:46px;flex:none;text-align:right;color:var(--ui-dim);font-size:11px;font-variant-numeric:tabular-nums}
  input[type=range]{flex:1;accent-color:var(--ui-accent);min-width:0}
  input[type=number],input[type=text],select{
    flex:1;min-width:0;padding:6px 8px;background:#111;border:1px solid var(--ui-line);
    border-radius:var(--ui-radius);
  }
  input[type=color]{
    width:34px;height:28px;padding:0;background:none;border:1px solid var(--ui-line);
    border-radius:var(--ui-radius);cursor:pointer;flex:none;
  }
  textarea{
    width:100%;min-height:130px;padding:9px;background:#111;border:1px solid var(--ui-line);
    border-radius:var(--ui-radius);resize:vertical;line-height:1.6;
  }
  .chips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
  .chip{padding:5px 9px;border:1px solid var(--ui-line);border-radius:var(--ui-radius);background:#232323;font-size:12px}
  .chip:hover{background:#2c2c2c}
  .chip.on{background:var(--ui-accent);color:#111;border-color:var(--ui-accent);font-weight:700}
  .hint{color:var(--ui-dim);font-size:11px;line-height:1.65}
  .hint code{background:#111;padding:1px 4px;border-radius:3px;color:var(--ui-accent)}
  .empty{color:var(--ui-dim);text-align:center;padding:30px 10px;line-height:1.7;font-size:12px}
  .danger{color:#ff8080}

  #toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
    background:#000;border:1px solid var(--ui-line);padding:10px 16px;border-radius:8px;
    opacity:0;pointer-events:none;transition:opacity .2s;z-index:999;max-width:80vw;
  }
  #toast.show{opacity:1}
  .hidden{display:none!important}
</style>

<script>
/* =========================================================
   상수 — 디자인 시스템
   ========================================================= */
const W = 1080, H = 1350;
const PAD = 80;
/* ===================================================================

const DS = {

  line:    '#E7E4EE',   // 구분선

/* 라이트 장 전용 포인트 — 형광 라임은 밝은 배경에서 안 읽힌다 */
const PURPLE = '#7C3AED';

let uid = 0;
const nid = () => 'e' + (++uid);

/* =========================================================
   초기 문서 — 확정된 6장
   ========================================================= */
function mediaBox(o={}){
  return Object.assign({
    id:nid(), type:'media', mediaType:'image', src:null,
    x:0, y:0, w:W, h:Math.round(H*0.55),
    fit:'cover', posX:50, posY:50, dim:0, dimColor:'#000000',
    radius:0, borderW:0, borderColor:'#FFFFFF',
    label:'이미지 · 클릭 후 오른쪽에서 업로드'
  }, o);
}
function textBox(o={}){
  return Object.assign({
    id:nid(), type:'text', text:'텍스트',
    x:PAD, y:800, w:W-PAD*2,
    size:DS.body, weight:400, lh:1.75, ls:-0.02,
    color:DS.onLight, align:'left'
  }, o);
}
function divider(o={}){
  return Object.assign({
    id:nid(), type:'divider', x:PAD, y:900, w:W-PAD*2,
    thickness:1, color:DS.line
  }, o);
}

/* 라벨 뱃지 — FLOWFULL 의 BODY CHECK 자리.
   진짜 배경칩은 편집기에 없으므로 포인트색 글자 + 대괄호로 대신한다. */
function badge(text, onDark, y){
  return textBox({
    text:'[ '+text+' ]', y:y, size:DS.label, weight:500, lh:1.4, ls:0.02,
    color: onDark ? DS.point : PURPLE
  });
}

                  y:1110, size:DS.body, weight:700, lh:1.6, color:DS.point })
      ]},

      /* 4 · 증거 (라이트) */
      { id:nid(), bg:DS.light, els:[
        mediaBox({ y:0, h:700, radius:12,
                   label:'배너 생성기 실제 화면 — 값이 들어간 상태로 캡처' }),

      ]},

      /* 5 · 전환 유도 (다크) */
      { id:nid(), bg:DS.dark, els:[

                   label:'커피 앞 햄스터' }),

}

/* ===== 교체 구간 끝. 아래 코드는 건드리지 않는다 ===== */

let doc = initialDoc();
let cur = 0;
let selId = null;

/* =========================================================
   유틸
   ========================================================= */
const $ = s => document.querySelector(s);
const stage = $('#stage');
const slide = () => doc.slides[cur];
const sel = () => slide().els.find(e => e.id === selId) || null;

function toast(msg, ms=2600){
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), ms);
}
function esc(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
/* **굵게**  ==하이라이트==  !!포인트색!! */
function markup(text){
  let s = esc(text);
  s = s.replace(/\*\*([\s\S]+?)\*\*/g, '<b>$1</b>');
  s = s.replace(/==([\s\S]+?)==/g,
        `<mark style="background:${doc.point};color:#111">$1</mark>`);
  s = s.replace(/!!([\s\S]+?)!!/g, `<span style="color:${doc.point}">$1</span>`);
  return s.replace(/\n/g, '<br>');
}

/* =========================================================
   렌더
   ========================================================= */
function elNode(e, interactive=true){
  const d = document.createElement('div');
  d.className = 'el ' + e.type;
  d.dataset.id = e.id;
  d.style.left = e.x + 'px';
  d.style.top  = e.y + 'px';
  d.style.width = e.w + 'px';

  if(e.type === 'text'){
    d.style.fontSize = e.size + 'px';
    d.style.fontWeight = e.weight;
    d.style.lineHeight = e.lh;
    d.style.letterSpacing = e.ls + 'em';
    d.style.color = e.color;
    d.style.textAlign = e.align;
    d.innerHTML = markup(e.text);
  }
  else if(e.type === 'divider'){
    d.style.height = e.thickness + 'px';
    d.style.background = e.color;
  }
  else if(e.type === 'media'){
    d.style.height = e.h + 'px';
    d.style.borderRadius = e.radius + 'px';
    if(e.borderW > 0) d.style.border = `${e.borderW}px solid ${e.borderColor}`;
    if(e.src){
      d.style.background = 'transparent';   // 다 보이기일 때 뒤에 슬라이드 배경이 비치게
      if(e.mediaType === 'video'){
        const m = document.createElement('video');
        m.src = e.src;
        m.style.objectFit = e.fit;
        m.style.objectPosition = (e.posX==null?50:e.posX) + '% ' + (e.posY==null?50:e.posY) + '%';
        m.autoplay = true; m.loop = true; m.muted = true; m.playsInline = true;
        d.appendChild(m);
      } else {
        /* 사진은 background 로 그린다.
           PNG 저장 라이브러리가 object-fit 을 무시하고 늘려버려서,
           어디서나 같게 나오는 background-size 로 바꿨다. */
        const m = document.createElement('div');
        m.style.position = 'absolute';
        m.style.inset = '0';
        m.style.backgroundImage = 'url(' + e.src + ')';
        m.style.backgroundRepeat = 'no-repeat';
        /* 이미 상자 크기대로 구워둔 그림이라 그대로 채운다 */
        m.style.backgroundSize = e.origSrc ? '100% 100%' : (e.fit === 'contain' ? 'contain' : (e.fit === 'fill' ? '100% 100%' : 'cover'));
        m.style.backgroundPosition = 'center';
        d.appendChild(m);
      }
    } else {
      const p = document.createElement('div');
      p.className = 'ph'; p.textContent = e.label || '이미지';
      d.appendChild(p);
    }
    if(e.dim > 0){
      const dim = document.createElement('div');
      dim.className = 'dim';
      dim.style.background = e.dimColor;
      dim.style.opacity = e.dim;
      d.appendChild(dim);
    }
  }

  if(interactive && e.id === selId) d.classList.add('selected');
  return d;
}

function renderStage(){
  const s = slide();
  stage.style.background = s.bg;
  stage.innerHTML = '';
  s.els.forEach(e => stage.appendChild(elNode(e)));
  drawHandles();
}

function drawHandles(){
  stage.querySelectorAll('.handle').forEach(h => h.remove());
  const e = sel();
  if(!e) return;
  const h = e.type === 'media' ? e.h : (stage.querySelector(`[data-id="${e.id}"]`)?.offsetHeight || 0);
  const pts = [['nw',0,0],['ne',e.w,0],['sw',0,h],['se',e.w,h]];
  pts.forEach(([k,px,py])=>{
    const n = document.createElement('div');
    n.className = 'handle h-' + k;
    n.dataset.k = k;
    n.style.left = (e.x + px - 7) + 'px';
    n.style.top  = (e.y + py - 7) + 'px';
    stage.appendChild(n);
  });
}

function renderThumbs(){
  const box = $('#thumbs');
  box.innerHTML = '';
  doc.slides.forEach((s, i) => {
    const t = document.createElement('div');
    t.className = 'thumb' + (i === cur ? ' active' : '');
    t.style.background = s.bg;
    t.innerHTML = `<div class="no">${i+1}</div>`;
    const mini = document.createElement('div');
    mini.className = 'mini';
    mini.style.width = W + 'px'; mini.style.height = H + 'px';
    s.els.forEach(e => mini.appendChild(elNode(e, false)));
    t.appendChild(mini);
    requestAnimationFrame(()=>{ mini.style.transform = 'scale(' + (t.clientWidth / W) + ')'; });
    t.onclick = ()=>{ cur = i; selId = null; renderAll(); };
    box.appendChild(t);
  });
}

function applyFont(){ stage.style.fontFamily = DS.font; }

function fitStage(){
  const area = $('#canvasArea');
  const k = Math.min((area.clientWidth - 48) / W, (area.clientHeight - 48) / H);
  stage.style.transform = 'scale(' + k + ')';
  const wrap = stage.parentElement;
  wrap.style.width  = (W * k) + 'px';
  wrap.style.height = (H * k) + 'px';
  stage._scale = k;
}

function renderAll(){ applyFont(); renderStage(); renderThumbs(); renderInsp(); scheduleSave(); }

/* =========================================================
   자동 저장 — 브라우저 DB(IndexedDB). 사진이 들어가도 용량 여유가 있다.
   이 브라우저 안에만 남는다. 다른 기기로는 안 따라간다.
   ========================================================= */
const DB_NAME = 'carousel-editor', STORE = 'doc', KEY = 'current';
function idb(){
  return new Promise((res, rej) => {
    const q = indexedDB.open(DB_NAME, 1);
    q.onupgradeneeded = () => q.result.createObjectStore(STORE);
    q.onsuccess = () => res(q.result);
    q.onerror = () => rej(q.error);
  });
}
async function idbPut(v){
  const db = await idb();
  return new Promise((res, rej) => {
    const t = db.transaction(STORE, 'readwrite');
    t.objectStore(STORE).put(v, KEY);
    t.oncomplete = res; t.onerror = () => rej(t.error);
  });
}
async function idbGet(){
  const db = await idb();
  return new Promise((res, rej) => {
    const t = db.transaction(STORE, 'readonly');
    const q = t.objectStore(STORE).get(KEY);
    q.onsuccess = () => res(q.result || null);
    q.onerror = () => rej(q.error);
  });
}
/* =========================================================
   자르기를 미리 굽는다.
   PNG 저장 라이브러리가 object-fit / background-size 를 제대로
   그리지 못해, 화면과 저장본이 달라졌다. 그래서 올리는 시점에
   상자 크기대로 잘라낸 이미지를 따로 만들어 두고, 화면과 저장
   양쪽 모두 그 이미지를 그대로 그린다.
   ========================================================= */
function bakeMedia(e){
  return new Promise(res => {
    const src = e.origSrc || e.src;
    if(!src || e.mediaType === 'video'){ res(); return; }
    const img = new Image();
    img.onload = () => {
      const w = Math.max(1, Math.round(e.w)), h = Math.max(1, Math.round(e.h));
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const g = c.getContext('2d');
      const iw = img.naturalWidth, ih = img.naturalHeight;
      if(e.fit === 'fill'){
        g.drawImage(img, 0, 0, w, h);
      } else {
        const scale = e.fit === 'contain'
          ? Math.min(w/iw, h/ih)
          : Math.max(w/iw, h/ih);
        const dw = iw*scale, dh = ih*scale;
        const px = (e.posX==null?50:e.posX)/100, py = (e.posY==null?50:e.posY)/100;
        g.drawImage(img, (w-dw)*px, (h-dh)*py, dw, dh);
      }
      e.origSrc = src;
      e.src = c.toDataURL('image/png');
      res();
    };
    img.onerror = () => res();
    img.src = src;
  });
}
let bakeTimer = null;
function scheduleBake(e){
  clearTimeout(bakeTimer);
  bakeTimer = setTimeout(() => { bakeMedia(e).then(renderAll); }, 200);
}

let saveTimer = null, saving = false;
function setSaveMark(text){ const el = document.getElementById('saveMark'); if(el) el.textContent = text; }
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    if(saving) return; saving = true;
    try{ await idbPut(JSON.parse(JSON.stringify(doc))); setSaveMark('저장됨'); }
    catch(e){ setSaveMark('저장 실패'); console.warn('autosave', e); }
    saving = false;
  }, 700);
}
async function restoreSaved(){
  try{
    const d = await idbGet();
    if(!d || !d.slides || !Array.isArray(d.slides) || !d.slides.length) return false;
    doc = d; cur = 0; selId = null;
    uid = 0; doc.slides.forEach(sl => { sl.id = nid(); sl.els.forEach(e => e.id = nid()); });
    return true;
  }catch(e){ console.warn('restore', e); return false; }
}

/* ---------- 인스펙터 이벤트 ---------- */
function bindInsp(){
  const e = sel(), s = slide();
  const on = (id, ev, fn) => { const n = document.getElementById(id); if(n) n.addEventListener(ev, fn); };
  const live = (id, fn, unit='') => {
    const n = document.getElementById(id); if(!n) return;
    n.addEventListener('input', () => {
      const v = parseFloat(n.value);
      const lab = document.getElementById(id + 'v');
      if(lab) lab.textContent = v + unit;
      fn(v); renderStage();
    });
    n.addEventListener('change', renderThumbs);
  };

  /* 슬라이드 */
  on('sBg','input', ev => { s.bg = ev.target.value; $('#sBgHex').value = ev.target.value; renderStage(); renderThumbs(); });
  on('sBgHex','change', ev => { s.bg = ev.target.value; renderAll(); });
  document.querySelectorAll('[data-bg]').forEach(b =>
    b.onclick = () => { s.bg = b.dataset.bg; renderAll(); });
  on('pPoint','input', ev => { doc.point = ev.target.value; $('#pPointHex').value = ev.target.value; renderStage(); renderThumbs(); });
  on('pPointHex','change', ev => { doc.point = ev.target.value; renderAll(); });

  on('dupSlide','click', () => {
    const copy = JSON.parse(JSON.stringify(s));
    copy.id = nid(); copy.els.forEach(x => x.id = nid());
    doc.slides.splice(cur+1, 0, copy); cur++; selId = null; renderAll();
  });
  on('delSlide','click', () => {
    if(doc.slides.length <= 1) return toast('슬라이드가 하나뿐이라 지울 수 없습니다');
    doc.slides.splice(cur,1); cur = Math.max(0, cur-1); selId = null; renderAll();
  });
  on('mvUp','click', () => {
    if(cur === 0) return;
    [doc.slides[cur-1], doc.slides[cur]] = [doc.slides[cur], doc.slides[cur-1]];
    cur--; renderAll();
  });
  on('mvDown','click', () => {
    if(cur === doc.slides.length-1) return;
    [doc.slides[cur+1], doc.slides[cur]] = [doc.slides[cur], doc.slides[cur+1]];
    cur++; renderAll();
  });

  if(!e) return;

  /* 텍스트 */
  on('tText','input', ev => { e.text = ev.target.value; renderStage(); });
  on('tText','change', renderThumbs);
  document.querySelectorAll('[data-wrap]').forEach(b => b.onclick = () => {
    const ta = $('#tText'); if(!ta) return;
    const m = b.dataset.wrap;
    const a = ta.selectionStart, z = ta.selectionEnd;
    if(a === z) return toast('감쌀 글자를 먼저 드래그해 주세요');
    const v = ta.value;
    ta.value = v.slice(0,a) + m + v.slice(a,z) + m + v.slice(z);
    e.text = ta.value;
    ta.focus(); ta.setSelectionRange(a, z + m.length*2);
    renderStage(); renderThumbs();
  });
  live('tSize', v => e.size = v, 'px');
  live('tLh',   v => e.lh = v);
  live('tLs',   v => e.ls = v, 'em');
  on('tWeight','change', ev => { e.weight = +ev.target.value; renderStage(); renderThumbs(); });
  on('tColor','input', ev => { e.color = ev.target.value; $('#tColorHex').value = ev.target.value; renderStage(); });
  on('tColorHex','change', ev => { e.color = ev.target.value; renderAll(); });
  document.querySelectorAll('[data-color]').forEach(b =>
    b.onclick = () => { e.color = b.dataset.color; renderAll(); });
  on('tAlign','change', ev => { e.align = ev.target.value; renderStage(); renderThumbs(); });

  /* 미디어 */
  on('mUpload','click', () => pickFile(e));
  on('mClear','click', () => { e.src = null; renderAll(); });
  on('mFit','change', ev => { e.fit = ev.target.value; renderAll(); scheduleBake(e); });
  live('mPosY',   v => { e.posY = v; scheduleBake(e); });
  live('mPosX',   v => { e.posX = v; scheduleBake(e); });
  live('mDim',    v => e.dim = v);
  live('mRadius', v => e.radius = v, 'px');
  live('mBorder', v => e.borderW = v, 'px');
  on('mDimColor','input', ev => { e.dimColor = ev.target.value; $('#mDimHex').value = ev.target.value; renderStage(); });
  on('mDimHex','change', ev => { e.dimColor = ev.target.value; renderAll(); });
  on('mBorderColor','input', ev => { e.borderColor = ev.target.value; renderStage(); });
  on('mH','change', ev => { e.h = +ev.target.value; renderAll(); scheduleBake(e); });

  /* 구분선 */
  live('dTh', v => e.thickness = v, 'px');
  on('dColor','input', ev => { e.color = ev.target.value; $('#dColorHex').value = ev.target.value; renderStage(); });
  on('dColorHex','change', ev => { e.color = ev.target.value; renderAll(); });

  /* 공통 */
  on('eW','change', ev => { e.w = +ev.target.value; renderAll(); });
  on('eX','change', ev => { e.x = +ev.target.value; renderAll(); });
  on('eY','change', ev => { e.y = +ev.target.value; renderAll(); });
  on('alignL','click', () => { e.x = PAD; renderAll(); });
  on('alignC','click', () => { e.x = Math.round((W - e.w)/2); renderAll(); });
  on('fullW','click',  () => { e.x = 0; e.w = W; renderAll(); });
  on('toFront','click', () => { const i = s.els.indexOf(e); s.els.splice(i,1); s.els.push(e); renderAll(); });
  on('toBack','click',  () => { const i = s.els.indexOf(e); s.els.splice(i,1); s.els.unshift(e); renderAll(); });
  on('dupEl','click', () => {
    const c = JSON.parse(JSON.stringify(e)); c.id = nid(); c.x += 20; c.y += 20;
    s.els.push(c); selId = c.id; renderAll();
  });
  on('delEl','click', () => {
    s.els.splice(s.els.indexOf(e),1); selId = null; renderAll();
  });
}

/* =========================================================
   파일 업로드
   ========================================================= */
let pendingEl = null;
function pickFile(el){
  pendingEl = el;
  const f = $('#filePick'); f.value = ''; f.click();
}
$('#filePick').addEventListener('change', ev => {
  const file = ev.target.files[0];
  if(!file || !pendingEl) return;
  const isVid = file.type.startsWith('video');
  const r = new FileReader();
  r.onload = () => {
    pendingEl.src = r.result;
    pendingEl.origSrc = r.result;
    pendingEl.mediaType = isVid ? 'video' : 'image';
    if(isVid){ renderAll(); toast('영상을 넣었습니다'); }
    else bakeMedia(pendingEl).then(() => { renderAll(); toast('이미지를 넣었습니다'); });
  };
  r.readAsDataURL(file);
});

/* =========================================================
   드래그 · 리사이즈 · 선택
   ========================================================= */
let drag = null;

stage.addEventListener('pointerdown', ev => {
  const k = stage._scale || 1;
  const hd = ev.target.closest('.handle');
  const node = ev.target.closest('.el');

  if(hd){
    const e = sel(); if(!e) return;
    drag = { mode:'resize', k:hd.dataset.k, e,
             sx:ev.clientX, sy:ev.clientY,
             ox:e.x, oy:e.y, ow:e.w, oh:e.h||0 };
    stage.setPointerCapture(ev.pointerId);
    return;
  }
  if(node){
    selId = node.dataset.id;
    const e = sel();
    drag = { mode:'move', e, sx:ev.clientX, sy:ev.clientY, ox:e.x, oy:e.y };
    stage.setPointerCapture(ev.pointerId);
    renderAll();
    return;
  }
  selId = null; renderAll();
});

stage.addEventListener('pointermove', ev => {
  if(!drag) return;
  const k = stage._scale || 1;
  const dx = Math.round((ev.clientX - drag.sx)/k);
  const dy = Math.round((ev.clientY - drag.sy)/k);
  const e = drag.e;

  if(drag.mode === 'move'){
    e.x = drag.ox + dx; e.y = drag.oy + dy;
  } else {
    const west  = drag.k.includes('w');
    const north = drag.k.includes('n');
    if(west){ e.x = drag.ox + dx; e.w = Math.max(40, drag.ow - dx); }
    else    { e.w = Math.max(40, drag.ow + dx); }
    if(e.type === 'media'){
      if(north){ e.y = drag.oy + dy; e.h = Math.max(40, drag.oh - dy); }
      else     { e.h = Math.max(40, drag.oh + dy); }
    }
  }
  renderStage();
});

['pointerup','pointercancel'].forEach(t =>
  stage.addEventListener(t, () => { if(drag){ const el = sel(); drag = null; renderAll(); if(el && el.type==='media') scheduleBake(el); } }));

document.addEventListener('keydown', ev => {
  if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  const e = sel(); if(!e) return;
  const step = ev.shiftKey ? 10 : 1;
  const map = { ArrowLeft:['x',-1], ArrowRight:['x',1], ArrowUp:['y',-1], ArrowDown:['y',1] };
  if(map[ev.key]){
    const [ax, dir] = map[ev.key];
    e[ax] += dir*step; ev.preventDefault(); renderStage(); return;
  }
  if(ev.key === 'Delete' || ev.key === 'Backspace'){
    slide().els.splice(slide().els.indexOf(e),1); selId = null; ev.preventDefault(); renderAll();
  }
});

   요소 추가

$('#addText').onclick = () => {
  const dark = isDark(slide().bg);
  const e = textBox({ y:400, color: dark ? DS.onDark : DS.onLight, text:'새 텍스트' });
  slide().els.push(e); selId = e.id; renderAll();
};
$('#addImage').onclick = () => {
  // 빈 이미지 자리가 선택돼 있으면 새로 만들지 않고 그 자리에 넣는다
  const cur = sel();
  if(cur && cur.type === 'media'){ pickFile(cur); return; }
  // 선택이 없으면 이 장의 첫 빈 이미지 자리를 찾아 거기에 넣는다
  const empty = slide().els.find(e => e.type === 'media' && !e.src);
  if(empty){ selId = empty.id; renderAll(); pickFile(empty); return; }
  const e = mediaBox({ y:200, x:PAD, w:W-PAD*2, h:600, label:'이미지' });
  slide().els.push(e); selId = e.id; renderAll(); pickFile(e);
};
$('#addVideo').onclick = () => {
  const cur = sel();
  if(cur && cur.type === 'media'){ cur.mediaType = 'video'; pickFile(cur); return; }
  const e = mediaBox({ y:200, x:PAD, w:W-PAD*2, h:600, mediaType:'video', label:'영상' });
  slide().els.push(e); selId = e.id; renderAll(); pickFile(e);
};
$('#addDivider').onclick = () => {
  const e = divider({ y:600, color: isDark(slide().bg) ? '#333333' : DS.line });
  slide().els.push(e); selId = e.id; renderAll();
};
$('#addSlide').onclick = () => {
  const s = { id:nid(), bg:DS.light, els:[] };
  doc.slides.push(s); cur = doc.slides.length-1; selId = null; renderAll();
};

function isDark(hex){
  const c = hex.replace('#','');
  const r = parseInt(c.substr(0,2),16), g = parseInt(c.substr(2,2),16), b = parseInt(c.substr(4,2),16);
  return (r*299 + g*587 + b*114)/1000 < 140;
}

/* =========================================================
   내보내기
   ========================================================= */
function stripUI(){
  stage.querySelectorAll('.handle').forEach(h => h.style.display = 'none');
  stage.querySelectorAll('.el').forEach(n => n.classList.remove('selected'));
}
function restoreUI(){ renderStage(); }

async function snap(i){
  cur = i; selId = null;
  renderStage(); stripUI();
  const t = stage.style.transform;
  stage.style.transform = 'none';
  await new Promise(r => setTimeout(r, 90));   // 폰트 · 이미지 반영 대기
  const canvas = await html2canvas(stage, {
    width:W, height:H, scale:1, backgroundColor: slide().bg,
    useCORS:true, logging:false,
    onclone: cdoc => {
      cdoc.querySelectorAll('video').forEach(v => {
        try{
          const c = cdoc.createElement('canvas');
          c.width = v.videoWidth || v.clientWidth;
          c.height = v.videoHeight || v.clientHeight;
          const live = document.querySelector(`video[src="${v.getAttribute('src')}"]`);
          if(live) c.getContext('2d').drawImage(live, 0, 0, c.width, c.height);
          c.style.cssText = v.style.cssText;
          c.style.width = '100%'; c.style.height = '100%';
          v.replaceWith(c);
        }catch(_){}
      });
    }
  });
  stage.style.transform = t;
  return canvas;
}

function download(url, name){
  const a = document.createElement('a');
  a.href = url; a.download = name; a.click();
}

$('#pngOne').onclick = async () => {
  const i = cur;
  toast('PNG를 만드는 중…');
  const c = await snap(i);
  download(c.toDataURL('image/png'), `carousel_${String(i+1).padStart(2,'0')}.png`);
  renderAll(); toast(`${i+1}번 슬라이드를 내려받았습니다`);
};

$('#pngAll').onclick = async () => {
  const back = cur;
  toast('전체 PNG를 만드는 중…');
  for(let i = 0; i < doc.slides.length; i++){
    const c = await snap(i);
    download(c.toDataURL('image/png'), `carousel_${String(i+1).padStart(2,'0')}.png`);
    await new Promise(r => setTimeout(r, 400));  // 브라우저 연속 다운로드 여유
  }
  cur = back; renderAll();
  toast(`${doc.slides.length}장을 내려받았습니다`);
};

$('#mp4').onclick = async () => {
  const secRaw = prompt('한 장을 몇 초씩 보여줄까요?', '2.5');
  if(secRaw === null) return;
  const sec = Math.max(0.5, parseFloat(secRaw) || 2.5);

  const types = [
    'video/mp4;codecs=avc1.42E01E',
    'video/mp4',
    'video/webm;codecs=vp9',
    'video/webm'
  ];
  const mime = types.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t));
  if(!mime) return toast('이 브라우저는 영상 저장을 지원하지 않습니다');

  const back = cur;
  toast('슬라이드를 이미지로 굽는 중…', 6000);
  const frames = [];
  for(let i = 0; i < doc.slides.length; i++) frames.push(await snap(i));
  cur = back; renderAll();

  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  const stream = c.captureStream(30);
  const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 8_000_000 });
  const chunks = [];
  rec.ondataavailable = ev => ev.data.size && chunks.push(ev.data);

  const isMp4 = mime.startsWith('video/mp4');
  rec.onstop = () => {
    const blob = new Blob(chunks, { type: mime });
    download(URL.createObjectURL(blob), 'carousel.' + (isMp4 ? 'mp4' : 'webm'));
    toast(isMp4
      ? 'MP4로 저장했습니다'
      : '이 브라우저는 MP4 녹화를 지원하지 않아 WebM으로 저장했습니다', 5200);
  };

  rec.start();
  toast('영상을 만드는 중…', sec * frames.length * 1000);
  for(const f of frames){
    ctx.clearRect(0,0,W,H);
    ctx.drawImage(f, 0, 0);
    await new Promise(r => setTimeout(r, sec * 1000));
  }
  await new Promise(r => setTimeout(r, 200));
  rec.stop();
};

/* 프로젝트 저장 · 불러오기 */
$('#saveJson').onclick = () => {
  const blob = new Blob([JSON.stringify(doc)], { type:'application/json' });
  download(URL.createObjectURL(blob), 'carousel-project.json');
  toast('프로젝트 파일을 내려받았습니다');
};
$('#resetDoc').onclick = async () => {
  if(!confirm('지금 작업을 버리고 처음 구성으로 돌아갑니다. 계속할까요?')) return;
  doc = initialDoc(); cur = 0; selId = null; renderAll(); toast('처음 구성으로 돌아갔습니다');
};
$('#loadJson').onclick = () => { const f = $('#jsonPick'); f.value=''; f.click(); };
$('#jsonPick').addEventListener('change', ev => {
  const file = ev.target.files[0]; if(!file) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      if(!d.slides || !Array.isArray(d.slides)) throw new Error('형식이 맞지 않습니다');
      doc = d; cur = 0; selId = null;
      uid = 0; doc.slides.forEach(s => { s.id = nid(); s.els.forEach(e => e.id = nid()); });
      renderAll(); toast('프로젝트를 불러왔습니다');
    }catch(err){
      toast('불러오지 못했습니다 — ' + err.message, 4000);
    }
  };
  r.readAsText(file);
});

/* =========================================================
   캡션
   ========================================================= */
const capPanel = $('#capPanel'), capText = $('#capText');

function syncCaption(){
  const v = capText.value;
  const lines = v.split('\n');
  $('#capCount').textContent = v.length.toLocaleString() + '자'
    + (v.length > 2200 ? ' · 2,200자를 넘었습니다' : '');
  $('#capCount').className = v.length > 2200 ? 'hint danger' : 'hint';
  const tags = (v.match(/#[^\s#]+/g) || []).length;
  $('#capFirst').innerHTML =
    `펼치기 전 보이는 부분<br><br>` +
    `<span style="color:#e8e8e8">${esc(lines[0] || '—')}<br>${esc(lines[1] || '')}</span>` +
    `<br><br>해시태그 ${tags}개` + (tags > 30 ? ' · 30개를 넘었습니다' : '');
}

$('#capToggle').onclick = () => {
  const showing = !capPanel.classList.contains('hidden');
  capPanel.classList.toggle('hidden', !showing ? false : true);
  $('#insp').classList.toggle('hidden', showing ? false : true);
  $('#capToggle').classList.toggle('primary', !showing);
  if(!showing){ capText.value = doc.caption || ''; syncCaption(); }
};
capText.addEventListener('input', () => { doc.caption = capText.value; syncCaption(); });

$('#capCopy').onclick = async () => {
  try{
    await navigator.clipboard.writeText(capText.value);
    toast('캡션을 복사했습니다');
  }catch(_){
    capText.select(); document.execCommand('copy');
    toast('캡션을 복사했습니다');
  }
};
$('#capTxt').onclick = () => {
  const blob = new Blob([capText.value], { type:'text/plain;charset=utf-8' });
  download(URL.createObjectURL(blob), 'caption.txt');
};

/* =========================================================
   시작
   ========================================================= */
window.addEventListener('resize', () => { fitStage(); });
fitStage();
restoreSaved().then(async ok => {
  renderAll();
  if(ok){
    /* 예전에 넣은 사진은 구워둔 게 없다. 한 번 구워서 저장본과 화면을 맞춘다. */
    const old = [];
    doc.slides.forEach(sl => sl.els.forEach(e => {
      if(e.type === 'media' && e.src && !e.origSrc && e.mediaType !== 'video') old.push(e);
    }));
    if(old.length){
      for(const e of old) await bakeMedia(e);
      renderAll();
      toast(old.length + '장의 사진을 저장용으로 다시 맞췄습니다', 3500);
    } else {
      setSaveMark('저장됨'); toast('직전 작업을 불러왔습니다');
    }
  }
});
if(document.fonts && document.fonts.ready) document.fonts.ready.then(renderAll);
</script>
