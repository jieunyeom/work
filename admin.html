<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>신청 현황 · 이커머스 도구 8개</title>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1B2028;--muted:#6B7280;--line:#E7E4EE;--bg:#F5F4F9;--pt:#7C3AED;--pt2:#EDE9FE}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:14px;line-height:1.6;padding:22px 16px 60px}
.wrap{max-width:760px;margin:0 auto}
h1{font-size:20px;font-weight:800;letter-spacing:-.03em;margin:0 0 4px}
.sub{font-size:12.5px;color:var(--muted);margin:0 0 20px}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}
.kpi .card{text-align:center}
.kpi u{display:block;font-size:12px;color:var(--muted);text-decoration:none;margin-bottom:6px}
.kpi b{font-size:30px;font-weight:800;letter-spacing:-.04em}
.kpi .hl b{color:var(--pt)}
h2{font-size:13px;font-weight:800;color:var(--pt);letter-spacing:.02em;margin:22px 0 10px}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
th,td{padding:11px 13px;text-align:left;font-size:13.5px;border-bottom:1px solid #F1EFF6}
th{background:#FAF9FD;font-weight:800;font-size:12px;color:var(--muted)}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-weight:800}
.bar{height:6px;background:var(--pt2);border-radius:99px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--pt)}
.empty{color:var(--muted);font-size:13px;padding:16px 13px;background:#fff;border:1px solid var(--line);border-radius:14px}
.foot{margin-top:26px;font-size:12px;color:var(--muted);line-height:1.7}
.foot b{color:var(--ink)}
.rf{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 14px;
  font-family:inherit;font-size:13px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <h1>신청 현황</h1>
  <p class="sub">퇴근이 빨라지는 이커머스 도구 8개 · 선착순 10명</p>

  <div class="kpi">
    <div class="card hl"><u>신청</u><b id="k-total">–</b></div>
    <div class="card"><u>남은 자리</u><b id="k-left">–</b></div>
    <div class="card"><u>오늘</u><b id="k-today">–</b></div>
  </div>

  <h2>어디서 들어왔나</h2>
  <div id="t-source"></div>

  <h2>무엇이 제일 손이 많이 가나</h2>
  <div id="t-topic"></div>

  <h2>날짜별</h2>
  <div id="t-day"></div>

  <button class="rf" onclick="loadAll()">새로고침</button>

  <p class="foot">
    이 화면은 <b>숫자만</b> 불러옵니다. 이름 · 연락처 · 이메일은 표시되지 않습니다.<br>
    개인정보는 행 수준 보안(RLS)으로 막혀 있어, 이 페이지 주소를 알아도 명단은 볼 수 없습니다.<br>
    명단이 필요하면 <b>Supabase → Table Editor</b> 에서 봅니다.
  </p>
</div>

<script>
var URL_='https://rpchylubijrpzfywbxhp.supabase.co';
var KEY_='sb_publishable_eRyzvnB4O666FN_gTqP9EA_M_8H7s9Z';
var TOTAL_SEATS=10;

function rpc(fn){
  return fetch(URL_+'/rest/v1/rpc/'+fn,{method:'POST',
    headers:{apikey:KEY_,'Content-Type':'application/json'},body:'{}'})
    .then(function(r){return r.json();});
}
function table(el,rows,cols){
  var box=document.getElementById(el);
  if(!rows||!rows.length){ box.innerHTML='<p class="empty">아직 없습니다.</p>'; return; }
  var max=Math.max.apply(null,rows.map(function(r){return r[cols.value];}))||1;
  var html='<table><tr>'+cols.head.map(function(h,i){return '<th'+(i===cols.head.length-1?' class="n"':'')+'>'+h+'</th>';}).join('')+'</tr>';
  rows.forEach(function(r){
    html+='<tr>';
    cols.keys.forEach(function(k){ html+='<td>'+(r[k]==null?'–':r[k])+'</td>'; });
    html+='<td class="n">'+r[cols.value]+'<div class="bar"><i style="width:'+Math.round(r[cols.value]/max*100)+'%"></i></div></td>';
    html+='</tr>';
  });
  document.getElementById(el).innerHTML=html+'</table>';
}
function loadAll(){
  rpc('seats_left').then(function(n){
    document.getElementById('k-left').textContent=n;
    document.getElementById('k-total').textContent=TOTAL_SEATS-n;
  });
  rpc('stats_by_source').then(function(rows){
    table('t-source',rows,{head:['채널','형태','소재','신청'],keys:['source','medium','content'],value:'cnt'});
  });
  rpc('stats_by_topic').then(function(rows){
    table('t-topic',rows,{head:['유형','신청'],keys:['topic'],value:'cnt'});
  });
  rpc('stats_by_day').then(function(rows){
    table('t-day',rows,{head:['날짜','신청'],keys:['day'],value:'cnt'});
    var today=new Date(Date.now()+9*3600*1000).toISOString().slice(0,10);
    var t=(rows||[]).find(function(r){return r.day===today;});
    document.getElementById('k-today').textContent=t?t.cnt:0;
  });
}
loadAll();
</script>
</body>
</html>
